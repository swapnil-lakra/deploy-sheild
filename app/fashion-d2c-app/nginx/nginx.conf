http { 
    # 🎯 FIX 1: Correct spelling of mime.types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream; 

    # 📌 Logging Configurations (Debugging ke liye bohot zaroori hai)
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 📌 Optimization Settings
    sendfile        on;
    keepalive_timeout  65;

    # 🎯 FIX 2: Upstream blocks ko server block ke BAAHAR (http ke andar) kar diya hai
    # Frontend upstream (Blue-Green Routing)
    upstream frontend {
        server 127.0.0.1:3000 weight=10;
        server 127.0.0.1:3001 weight=0;
    }

    # Backend upstream (Blue-Green Routing)
    upstream backend {
        server 127.0.0.1:8000 weight=10;
        server 127.0.0.1:8001 weight=0;
    }

    server { 
        listen 80;
        server_name _;
    
        # Health Check Endpoint
        location /health {
            default_type application/json;
            return 200 '{
                "status": "healthy",
                "active_environment": "blue"
            }';
        }
    
        # Frontend Reverse Proxy
        location / {
            proxy_pass http://frontend;
            
            # 📌 Standard Proxy Headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Support (Agar React/Next.js dev/production me zaroorat ho)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    
        # Backend API Reverse Proxy
        location /api/ {
            proxy_pass http://backend;
            
            # 📌 Standard Proxy Headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for API responses
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}