version: "3.8"

services:
  # MariaDB Database Engine
  mariadb:
    env_file: .env
    image: mariadb:11.4
    container_name: d2c-mariadb-${ENV_COLOR}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: d2c_fashion_${ENV_COLOR}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_USER_PASSWORD}
      MARIADB_CHARSET: utf8mb4
      MARIADB_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT}:3306"  
    volumes:
      - mariadb_data_${ENV_COLOR}:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 10s 
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - d2c-network
    command:
      - --max_connections=1000
      - --wait_timeout=600
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  
  # FastAPI Backend Service
  backend:
    env_file: .env
    image: ghcr.io/swapnil-lakra/deploy-sheild/fastapi-backend:${IMAGE_TAG}
    container_name: d2c-backend-${ENV_COLOR} 
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MARIADB_USER}:${MARIADB_USER_PASSWORD}@mariadb:3306/d2c_fashion_${ENV_COLOR}?charset=utf8mb4
      ENVIRONMENT: ${ENV_COLOR}
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - d2c-network
  
  # React.js Frontend Service
  frontend:
    image: ghcr.io/swapnil-lakra/deploy-sheild/reactjs-frontend:${IMAGE_TAG}
    container_name: d2c-frontend-${ENV_COLOR}
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
      ENVIRONMENT: ${ENV_COLOR}
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - d2c-network

volumes:
  # Dynamically isolation of volumes
  mariadb_data_blue:
  mariadb_data_green:

networks:
  d2c-network:  
    driver: bridge